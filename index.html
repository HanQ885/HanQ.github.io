<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HanQ 학점 도구</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202124;font-family:"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-end;padding:26px clamp(14px,4vw,42px) 16px;background:#fff;border-bottom:1px solid #dce1e7}.eyebrow{margin:0 0 6px;color:#117865;font-size:.82rem;font-weight:800}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.4rem,2.4vw,2.15rem)}h2{font-size:clamp(1.15rem,2vw,1.55rem)}h3{font-size:1rem}.tabs,.seg{display:inline-flex;padding:4px;border-radius:8px;background:#e9edf1}.tab,.seg button{min-height:38px;border:0;border-radius:6px;background:transparent;color:#626a73;font-weight:800;padding:0 14px}.tab.on,.seg button.on{background:#fff;color:#202124;box-shadow:0 1px 5px #0002}main{width:min(1220px,calc(100% - 32px));margin:24px auto 46px}.view{display:none}.view.on{display:block}.head,.card,.panel{background:#fff;border:1px solid #dce1e7;border-radius:8px;box-shadow:0 16px 42px #20212414}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px;margin-bottom:16px}.head p{margin-top:6px;color:#626a73}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}select,input{min-height:38px;border:1px solid #dce1e7;border-radius:6px;background:#fff;padding:0 10px}.btn{min-height:36px;border:1px solid #dce1e7;border-radius:6px;background:#fff;font-weight:800;padding:0 12px}.primary{border-color:#117865;background:#117865;color:#fff}.danger{border-color:#e6b5a9;background:#fff7f4;color:#b13a25}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{padding:16px;min-height:96px}.stat span{display:block;color:#626a73;font-size:.86rem;font-weight:800}.stat strong{display:block;margin-top:9px;font-size:clamp(1.35rem,3vw,2rem)}.stat em{display:block;margin-top:4px;color:#626a73;font-size:.88rem;font-style:normal}.table{overflow-x:auto}.table table{width:100%;min-width:850px;border-collapse:collapse}.table th,.table td{padding:13px 14px;border-bottom:1px solid #dce1e7;text-align:left;vertical-align:middle}.table th{background:#f0f2f4;color:#3e434a;font-size:.86rem}.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 8px;border-radius:999px;background:#e8ebef;color:#394049;font-size:.82rem;font-weight:800;white-space:nowrap}.quick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.grade-btn{min-width:44px;min-height:34px;border:1px solid #dce1e7;border-radius:6px;background:#fff;font-weight:900}.grade-btn.on{border-color:#117865;background:#e6f2ef;color:#0b5f50}.low{min-width:110px}.layout{display:grid;grid-template-columns:minmax(220px,.8fr) minmax(310px,1.25fr) minmax(300px,1fr);gap:16px;align-items:start}.panel{padding:16px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.title strong{color:#0b5f50}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filter.on{border-color:#117865;background:#e6f2ef;color:#0b5f50}.list{display:grid;gap:10px}.course{display:grid;gap:9px;padding:12px;border:1px solid #dce1e7;border-radius:8px;background:#fff}.course[draggable=true]{cursor:grab}.course.used{opacity:.55}.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.meta{display:flex;gap:6px;flex-wrap:wrap}.drop{min-height:370px;border:2px dashed #b7c2cc;border-radius:8px;background:#fafbfc;padding:12px}.drop.over{border-color:#117865;background:#e6f2ef}.empty{display:grid;min-height:120px;place-items:center;color:#626a73;font-weight:800}.empty.hide{display:none}.custom{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(120px,.85fr) minmax(100px,.75fr) auto;gap:8px;padding-top:12px;margin-top:12px;border-top:1px solid #dce1e7}.progress{margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.need{display:grid;gap:9px;padding:12px;border:1px solid #dce1e7;border-radius:8px;background:#fbfcfd}.meter{height:10px;border-radius:999px;overflow:hidden;background:#e5e8ec}.meter b{display:block;height:100%;background:#117865}.status{color:#626a73;font-size:.88rem;font-weight:700}.status.miss{color:#b13a25}.status.done{color:#0b5f50}.semester{display:flex;justify-content:space-between;gap:12px;margin-top:14px;padding:14px;border-radius:8px;background:#f0f2f4;font-weight:800}.semester span{color:#626a73}@media(max-width:980px){header,.head{align-items:stretch;flex-direction:column}.stats,.layout,.grid{grid-template-columns:1fr}.custom{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{width:calc(100% - 20px);margin-top:14px}header{padding:20px 12px 14px}.tabs{display:grid;grid-template-columns:1fr 1fr;width:100%}.custom{grid-template-columns:1fr}.semester{flex-direction:column}.quick{min-width:260px}}
</style>
</head>
<body>
<header><div><p class="eyebrow">HanQ 학업 도구</p><h1>학점 계산기 · 수강 미리보기</h1></div><nav class="tabs"><button class="tab on" data-view="gpa" type="button">학점 계산기</button><button class="tab" data-view="plan" type="button">수강 미리보기</button></nav></header>
<main>
<section class="view on" id="gpa"><div class="head"><div><h2>4.3 만점 학점 계산기</h2><p>총 반영 학점 25학점</p></div><div class="actions"><label>전체 입력 <select id="bulk"></select></label><button class="btn" id="resetGpa" type="button">초기화</button></div></div><div class="stats" id="stats"></div><div class="card table"><table><thead><tr><th>과목</th><th>학점</th><th>성적</th><th>환산점수</th><th>반영점수</th></tr></thead><tbody id="gradeRows"></tbody></table></div></section>
<section class="view" id="plan"><div class="head"><div><h2>수강 신청 미리보기</h2><p>필수수강 + 수강계획에 넣은 선택과목만 계산</p></div><div class="actions"><div class="seg"><button class="on" data-mode="base" type="button">기본</button><button data-mode="ap" type="button">AP</button></div><button class="btn" id="resetPlan" type="button">계획 비우기</button></div></div><div class="layout"><aside class="panel"><div class="title"><h3>필수수강</h3><strong id="reqTotal"></strong></div><div class="list" id="required"></div></aside><section class="panel"><div class="title"><h3>선택과목 후보</h3><strong id="candCount"></strong></div><div class="filters" id="filters"></div><div class="list" id="candidates"></div><form class="custom" id="custom"><input name="name" placeholder="과목명" required><input name="credit" placeholder="3, 4(3), 3/4 [AP]" required><select name="cat"><option>영어</option><option>외국어</option><option>교양</option><option>전문교과</option></select><button class="btn primary" type="submit">추가</button></form></section><section class="panel"><div class="title"><h3>수강계획</h3><strong id="planTotal"></strong></div><div class="drop" id="drop"><div class="empty" id="empty">여기에 과목을 드래그해서 넣기</div><div class="list" id="planned"></div></div></section></div><section class="panel progress"><div class="title"><h3>졸업 선택학점</h3><strong id="gradTotal"></strong></div><div class="grid" id="progress"></div><div class="semester" id="semester"></div></section></section>
</main>
<script>
const subjects=[['math3','수학Ⅲ',4],['physics','기초물리학및실험Ⅲ',2],['chem','기초화학및실험Ⅲ',2],['bio','기초생명과학및실험Ⅲ',2],['earth','기초지구과학및실험Ⅲ',2],['programming','컴퓨터프로그래밍',3],['literature','문학감상과비평',3],['english','영어회화',3],['economy','글로벌경제의이해',2],['japanese','일본어',2]];
const scale=[['A+',4.3],['A0',4.0],['A-',3.7],['B+',3.3],['B0',3.0],['B-',2.7],['C+',2.3],['C0',2.0],['C-',1.7],['D+',1.3],['D0',1.0],['D-',0.7],['F',0]],quick=['A+','A0','A-','B+','B0'];
const required=[['r1','문학감상과비평','필수',3],['r2','수학Ⅲ','필수',4],['r3','기초화학및실험Ⅲ','필수',2],['r4','기초물리학및실험Ⅲ','필수',2],['r5','기초생명과학및실험Ⅲ','필수',2],['r6','기초지구과학및실험Ⅲ','필수',2]];
const baseCourses=[['c1','영어회화','영어','3'],['c2','일본어','외국어','2'],['c3','글로벌경제의이해','교양','2'],['c4','지식재산일반','교양','2'],['c5','기업가정신및기술창업교육','교양','2'],['c6','지속가능발전의이해','교양','2'],['c7','컴퓨터프로그래밍','전문교과','3']];
const cats=['전체','영어','외국어','교양','전문교과'],need=[['영어',3],['외국어',2],['교양',4],['전문교과',29]];
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};let grades=load('hanqGrades',{}),planner=load('hanqPlanner',{ids:[],custom:[],cat:'전체',mode:'base'});const save=()=>{localStorage.setItem('hanqGrades',JSON.stringify(grades));localStorage.setItem('hanqPlanner',JSON.stringify(planner))};
const point=g=>scale.find(x=>x[0]===g)?.[1];const fmt=n=>Number.isInteger(Math.round(n*10)/10)?String(Math.round(n*10)/10):(Math.round(n*10)/10).toFixed(1);const num=x=>parseFloat(String(x).replace(/[^0-9.]/g,''))||0;
function parseCredit(t){t=String(t||'').trim();if(t.includes('/')){let p=t.split('/');return{base:num(p[0]),ap:num(p[1]),hours:null,label:`${fmt(num(p[0]))}/${fmt(num(p[1]))} [AP]`}}if(t.includes('(')){let p=t.split('(');return{base:num(p[1]),ap:null,hours:num(p[0]),label:`${fmt(num(p[0]))}(${fmt(num(p[1]))})`}}return{base:num(t),ap:null,hours:null,label:fmt(num(t))}}
function gradeControl(id,g){let buttons=quick.map(q=>`<button class="grade-btn ${g===q?'on':''}" data-grade-id="${id}" data-grade="${q}" type="button">${q}</button>`).join('');let lows='<option value="">B- 이하</option>'+scale.filter(x=>!quick.includes(x[0])).map(x=>`<option value="${x[0]}" ${g===x[0]?'selected':''}>${x[0]} (${x[1].toFixed(1)})</option>`).join('');return `<div class="quick">${buttons}<select class="low" data-low-grade="${id}">${lows}</select></div>`}
function renderGpa(){let bulk='<option value="">선택</option>'+scale.map(x=>`<option>${x[0]}</option>`).join('');$('#bulk').innerHTML=bulk;$('#gradeRows').innerHTML=subjects.map(s=>{let g=grades[s[0]]||'',p=point(g);return `<tr><td><strong>${s[1]}</strong></td><td><span class="pill">${s[2]}학점</span></td><td>${gradeControl(s[0],g)}</td><td>${p??'-'}</td><td>${p==null?'-':(p*s[2]).toFixed(2)}</td></tr>`}).join('');let total=25,entered=subjects.reduce((a,s)=>a+(grades[s[0]]?s[2]:0),0),sum=subjects.reduce((a,s)=>a+((point(grades[s[0]])??0)*s[2]),0),avg=entered?sum/entered:null;$('#stats').innerHTML=[['평점',avg==null?'-':avg.toFixed(2),'4.3 만점'],['입력 학점',entered,`전체 ${total}학점`],['반영점수',sum.toFixed(2),'성적점수 × 학점'],['남은 입력',total-entered,(total-entered?'학점':'완료')]].map(x=>`<div class="card stat"><span>${x[0]}</span><strong>${x[1]}</strong><em>${x[2]}</em></div>`).join('')}
const courses=()=>baseCourses.concat(planner.custom);const credit=c=>{let p=parseCredit(c[3]);return planner.mode==='ap'&&p.ap!==null?p.ap:p.base};const selected=()=>planner.ids.map(id=>courses().find(c=>c[0]===id)).filter(Boolean);const reqTotal=()=>required.reduce((a,c)=>a+c[3],0);
function courseCard(c,used=false,planned=false){let p=typeof c[3]==='number'?{base:c[3],label:fmt(c[3]),hours:null,ap:null}:parseCredit(c[3]);return `<article class="course ${used?'used':''}" ${planned?'':`draggable="${!used}" data-id="${c[0]}"`}><div class="row"><strong>${c[1]}</strong><span class="pill">${planned?fmt(credit(c)):p.label}학점</span></div><div class="meta"><span class="pill">${c[2]}</span>${p.hours?`<span class="pill">시수 ${fmt(p.hours)}</span>`:''}${p.ap!==null?`<span class="pill">AP ${fmt(p.ap)}</span>`:''}</div><div class="actions">${planned?`<button class="btn danger" data-remove="${c[0]}" type="button">삭제</button>`:`<button class="btn" data-add="${c[0]}" ${used?'disabled':''} type="button">${used?'추가됨':'담기'}</button>`}</div></article>`}
function renderPlan(){$('#required').innerHTML=required.map(c=>courseCard(c,false,true).replace(/<div class="actions">.*?<\/div>/,'')).join('');$('#reqTotal').textContent=`${fmt(reqTotal())}학점`;$('#filters').innerHTML=cats.map(c=>`<button class="btn filter ${planner.cat===c?'on':''}" data-filter="${c}" type="button">${c}</button>`).join('');let cand=courses().filter(c=>planner.cat==='전체'||c[2]===planner.cat);$('#candCount').textContent=`${cand.length}개`;$('#candidates').innerHTML=cand.map(c=>courseCard(c,planner.ids.includes(c[0]))).join('');let sel=selected();$('#empty').classList.toggle('hide',sel.length>0);$('#planned').innerHTML=sel.map(c=>courseCard(c,false,true)).join('');let pt=sel.reduce((a,c)=>a+credit(c),0);$('#planTotal').textContent=`${fmt(pt)}학점`;$('#gradTotal').textContent=`${fmt(pt)} / 38학점`;$('#progress').innerHTML=need.map(n=>{let v=sel.filter(c=>c[2]===n[0]).reduce((a,c)=>a+credit(c),0),miss=Math.max(0,n[1]-v),pct=Math.min(100,v/n[1]*100);return `<div class="need"><div class="row"><strong>${n[0]}</strong><strong>${fmt(v)} / ${fmt(n[1])}</strong></div><div class="meter"><b style="width:${pct}%"></b></div><div class="status ${miss?'miss':'done'}">${miss?`${fmt(miss)}학점 부족`:'충족'}</div></div>`}).join('');$('#semester').innerHTML=`<span>이번 학기 총 수강학점</span><strong>${fmt(reqTotal()+pt)}학점 = 필수 ${fmt(reqTotal())} + 계획 ${fmt(pt)}</strong><span>졸업 선택 ${fmt(Math.max(0,38-pt))}학점 남음</span>`;$$('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===planner.mode))}
function setGrade(id,g){g?grades[id]=g:delete grades[id];save();renderGpa()}function add(id){if(id&&!planner.ids.includes(id)){planner.ids.push(id);save();renderPlan()}}function remove(id){planner.ids=planner.ids.filter(x=>x!==id);save();renderPlan()}
document.addEventListener('click',e=>{if(e.target.dataset.gradeId)setGrade(e.target.dataset.gradeId,e.target.dataset.grade);if(e.target.dataset.add)add(e.target.dataset.add);if(e.target.dataset.remove)remove(e.target.dataset.remove);if(e.target.dataset.filter){planner.cat=e.target.dataset.filter;save();renderPlan()}if(e.target.dataset.mode){planner.mode=e.target.dataset.mode;save();renderPlan()}});document.addEventListener('change',e=>{if(e.target.dataset.lowGrade)setGrade(e.target.dataset.lowGrade,e.target.value)});$('#bulk').onchange=e=>{if(!e.target.value)return;subjects.forEach(s=>grades[s[0]]=e.target.value);e.target.value='';save();renderGpa()};$('#resetGpa').onclick=()=>{grades={};save();renderGpa()};$$('[data-view]').forEach(b=>b.onclick=()=>{$$('[data-view]').forEach(x=>x.classList.toggle('on',x===b));$$('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.view))});$('#resetPlan').onclick=()=>{planner.ids=[];save();renderPlan()};$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('over')};$('#drop').ondragleave=()=>$('#drop').classList.remove('over');$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('over');add(e.dataTransfer.getData('text/plain'))};document.addEventListener('dragstart',e=>{let c=e.target.closest('[data-id]');if(c&&!c.classList.contains('used'))e.dataTransfer.setData('text/plain',c.dataset.id)});$('#custom').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),cr=f.get('credit').trim(),cat=f.get('cat');if(!name||!cr||parseCredit(cr).base<=0)return;planner.custom.push([`u${Date.now()}`,name,cat,cr]);e.target.reset();save();renderPlan()};renderGpa();renderPlan();
</script>
</body>
</html>
