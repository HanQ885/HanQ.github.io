<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>학점 도구</title>
  <style>
    :root{--bg:#f5f6f8;--paper:#fff;--ink:#202124;--muted:#626a73;--line:#d9dee5;--teal:#117865;--teal2:#0b5f50;--amber:#b98205;--blue:#21548f;--red:#b13a25;--soft:#e6f2ef;--shadow:0 16px 42px rgba(32,33,36,.09)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif}button,input,select{font:inherit}button{cursor:pointer}header{display:flex;justify-content:space-between;align-items:end;gap:22px;padding:28px clamp(16px,4vw,46px) 18px;background:var(--paper);border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 6px;color:var(--teal);font-size:.82rem;font-weight:800}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.45rem,2.4vw,2.2rem)}h2{font-size:clamp(1.2rem,2vw,1.6rem)}h3{font-size:1rem}.tabs,.seg{display:inline-flex;padding:4px;border-radius:8px;background:#e9edf1}.tab,.seg button{min-height:38px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:800;padding:0 14px}.tab.on,.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 5px rgba(32,33,36,.12)}main{width:min(1220px,calc(100% - 32px));margin:26px auto 48px}.view{display:none}.view.on{display:block}.head,.card,.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px;margin-bottom:16px}.head p{margin-top:6px;color:var(--muted)}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}select,input{min-height:40px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:0 10px}.btn{min-height:38px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-weight:800;padding:0 12px}.primary{border-color:var(--teal);background:var(--teal);color:#fff}.danger{border-color:#e5b6aa;background:#fff7f4;color:var(--red)}.small{min-height:32px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.stat{min-height:104px;padding:16px}.stat span{display:block;color:var(--muted);font-size:.86rem;font-weight:800}.stat strong{display:block;margin-top:10px;font-size:clamp(1.35rem,3vw,2rem)}.stat em{display:block;margin-top:5px;color:var(--muted);font-style:normal;font-size:.88rem}.table{overflow-x:auto}.table table{width:100%;min-width:720px;border-collapse:collapse}.table th,.table td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left}.table th{background:#f0f2f4;color:#3e434a;font-size:.86rem}.table tr:last-child td{border-bottom:0}.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 8px;border-radius:999px;background:#e8ebef;color:#394049;font-size:.82rem;font-weight:800;white-space:nowrap}.layout{display:grid;grid-template-columns:minmax(220px,.85fr) minmax(300px,1.25fr) minmax(300px,1fr);gap:16px;align-items:start}.panel{padding:16px}.title{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px}.title strong{color:var(--teal2)}.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.filter.on{border-color:var(--teal);background:var(--soft);color:var(--teal2)}.list{display:grid;gap:10px}.course{display:grid;gap:10px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fff}.course[draggable=true]{cursor:grab}.course.used{opacity:.58}.row{display:flex;justify-content:space-between;align-items:start;gap:10px}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px}.tag[data-cat="영어"]{background:#e3efff;color:var(--blue)}.tag[data-cat="외국어"]{background:#f3e7ff;color:#6d3d8b}.tag[data-cat="교양"]{background:#fff0d2;color:#8a5a00}.tag[data-cat="전문교과"]{background:var(--soft);color:var(--teal2)}.course-actions{display:flex;justify-content:flex-end;gap:8px}.drop{min-height:380px;border:2px dashed #b7c2cc;border-radius:8px;background:#fafbfc;padding:12px}.drop.over{border-color:var(--teal);background:var(--soft)}.empty{display:grid;min-height:120px;place-items:center;color:var(--muted);font-weight:800}.empty.hide{display:none}.custom{display:grid;grid-template-columns:minmax(110px,1.1fr) minmax(120px,.9fr) minmax(105px,.75fr) auto;gap:8px;padding-top:12px;margin-top:12px;border-top:1px solid var(--line)}.progress{margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.need{display:grid;gap:9px;padding:12px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}.meter{height:10px;overflow:hidden;border-radius:999px;background:#e5e8ec}.meter b{display:block;height:100%;width:0;border-radius:inherit;background:var(--teal)}.status{color:var(--muted);font-size:.88rem;font-weight:700}.status.done{color:var(--teal2)}.status.miss{color:var(--red)}.semester{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding:14px;border-radius:8px;background:#f0f2f4;font-weight:800}.semester span{color:var(--muted)}@media(max-width:980px){header,.head{align-items:stretch;flex-direction:column}.actions{justify-content:flex-start}.stats,.layout,.grid{grid-template-columns:1fr}.custom{grid-template-columns:1fr 1fr}}@media(max-width:560px){main{width:min(100% - 20px,1220px);margin-top:14px}header{padding:20px 12px 14px}.tabs,.tab{width:100%}.tabs{display:grid;grid-template-columns:1fr 1fr}.custom{grid-template-columns:1fr}.semester{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <header>
    <div><p class="eyebrow">HanQ 학업 도구</p><h1>학점 계산기 · 수강 미리보기</h1></div>
    <nav class="tabs" aria-label="기능 선택"><button class="tab on" data-view="gpa" type="button">학점 계산기</button><button class="tab" data-view="plan" type="button">수강 미리보기</button></nav>
  </header>
  <main>
    <section class="view on" id="gpa">
      <div class="head"><div><h2>4.3 만점 학점 계산기</h2><p>총 반영 학점 25학점</p></div><div class="actions"><label>전체 입력 <select id="bulk"></select></label><button class="btn" id="resetGpa" type="button">초기화</button></div></div>
      <div class="stats" id="stats"></div>
      <div class="card table"><table><thead><tr><th>과목</th><th>학점</th><th>성적</th><th>환산점수</th><th>반영점수</th></tr></thead><tbody id="grades"></tbody></table></div>
    </section>
    <section class="view" id="plan">
      <div class="head"><div><h2>수강 신청 미리보기</h2><p>필수수강 + 수강계획 기준</p></div><div class="actions"><div class="seg"><button class="on" data-mode="base" type="button">기본</button><button data-mode="ap" type="button">AP</button></div><button class="btn" id="resetPlan" type="button">계획 비우기</button></div></div>
      <div class="layout">
        <aside class="panel"><div class="title"><h3>필수수강</h3><strong id="reqTotal">0학점</strong></div><div class="list" id="required"></div></aside>
        <section class="panel"><div class="title"><h3>선택과목 후보</h3><strong id="candCount">0개</strong></div><div class="filters" id="filters"></div><div class="list" id="candidates"></div><form class="custom" id="custom"><input name="name" placeholder="과목명" required><input name="credit" placeholder="3, 4(3), 3/4 [AP]" required><select name="cat"><option>영어</option><option>외국어</option><option>교양</option><option>전문교과</option></select><button class="btn primary" type="submit">추가</button></form></section>
        <section class="panel"><div class="title"><h3>수강계획</h3><strong id="planTotal">0학점</strong></div><div class="drop" id="drop" tabindex="0"><div class="empty" id="empty">여기에 과목 놓기</div><div class="list" id="planned"></div></div></section>
      </div>
      <section class="panel progress"><div class="title"><h3>졸업 선택학점</h3><strong id="gradTotal">0 / 38학점</strong></div><div class="grid" id="progress"></div><div class="semester" id="semester"></div></section>
    </section>
  </main>
  <script>
    const GPA=[['literature','문학감상과비평',3],['english','영어회화',3],['economy','글로벌경제의이해',2],['math3','수학Ⅲ',4],['chem','기초화학및실험Ⅲ',2],['physics','기초물리학및실험Ⅲ',2],['bio','기초생명과학및실험Ⅲ',2],['earth','기초지구과학및실험Ⅲ',2],['programming','컴퓨터프로그래밍',3],['japanese','일본어',2]];
    const SCALE=[['A+',4.3],['A0',4.0],['A-',3.7],['B+',3.3],['B0',3.0],['B-',2.7],['C+',2.3],['C0',2.0],['C-',1.7],['D+',1.3],['D0',1.0],['D-',0.7],['F',0]];
    const REQ=[['r1','문학감상과비평','필수','3'],['r2','수학Ⅲ','필수','4'],['r3','기초화학및실험Ⅲ','필수','2'],['r4','기초물리학및실험Ⅲ','필수','2'],['r5','기초생명과학및실험Ⅲ','필수','2'],['r6','기초지구과학및실험Ⅲ','필수','2']];
    const BASE=[['c1','영어회화','영어','3'],['c2','일본어','외국어','2'],['c3','글로벌경제의이해','교양','2'],['c4','지식재산일반','교양','2'],['c5','기업가정신및기술창업교육','교양','2'],['c6','지속가능발전의이해','교양','2'],['c7','컴퓨터프로그래밍','전문교과','3']];
    const CATS=['전체','영어','외국어','교양','전문교과'];
    const NEED=[['영어',3],['외국어',2],['교양',4],['전문교과',29]];
    const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}};
    let grades=load('hanqGrades',{});let planner=load('hanqPlanner',{ids:[],custom:[],cat:'전체',mode:'base'});const save=()=>{localStorage.setItem('hanqGrades',JSON.stringify(grades));localStorage.setItem('hanqPlanner',JSON.stringify(planner))};
    const fmt=n=>Number.isInteger(Math.round(n*10)/10)?String(Math.round(n*10)/10):(Math.round(n*10)/10).toFixed(1);const score=g=>SCALE.find(x=>x[0]===g)?.[1];
    function parse(t){t=String(t||'').trim();let ap=t.match(/(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)/);if(ap)return{base:+ap[1],ap:+ap[2],hours:null,label:`${fmt(+ap[1])}/${fmt(+ap[2])} [AP]`};let hc=t.match(/(\d+(?:\.\d+)?)\s*\(\s*(\d+(?:\.\d+)?)\s*\)/);if(hc)return{base:+hc[2],ap:null,hours:+hc[1],label:`${fmt(+hc[1])}(${fmt(+hc[2])})`};let p=t.match(/\d+(?:\.\d+)?/);let c=p?+p[0]:0;return{base:c,ap:null,hours:null,label:fmt(c)}}
    const courses=()=>BASE.concat(planner.custom);const credit=c=>{let p=parse(c[3]);return planner.mode==='ap'&&p.ap!==null?p.ap:p.base};const reqTotal=()=>REQ.reduce((a,c)=>a+parse(c[3]).base,0);const selected=()=>planner.ids.map(id=>courses().find(c=>c[0]===id)).filter(Boolean);
    function renderGpa(){let opts='<option value="">미입력</option>'+SCALE.map(g=>`<option value="${g[0]}">${g[0]} (${g[1].toFixed(1)})</option>`).join('');$('#bulk').innerHTML='<option value="">선택</option>'+SCALE.map(g=>`<option>${g[0]}</option>`).join('');$('#grades').innerHTML=GPA.map(c=>{let g=grades[c[0]]||'';let s=score(g);return `<tr><td><strong>${c[1]}</strong></td><td><span class="pill">${c[2]}학점</span></td><td><select data-grade="${c[0]}">${opts.replace(`value="${g}"`,`value="${g}" selected`)}</select></td><td>${s??'-'}</td><td>${s==null?'-':(s*c[2]).toFixed(2)}</td></tr>`}).join('');let total=GPA.reduce((a,c)=>a+c[2],0),entered=GPA.reduce((a,c)=>a+(grades[c[0]]?c[2]:0),0),points=GPA.reduce((a,c)=>a+((score(grades[c[0]])??0)*c[2]),0),avg=entered?points/entered:null;$('#stats').innerHTML=[['평점',avg==null?'-':avg.toFixed(2),'4.3 만점'],['입력 학점',entered,`전체 ${total}학점`],['반영점수',points.toFixed(2),'성적점수 × 학점'],['남은 입력',total-entered,(total-entered?'학점':'완료')]].map(x=>`<div class="card stat"><span>${x[0]}</span><strong>${x[1]}</strong><em>${x[2]}</em></div>`).join('')}
    function card(c,used=false,planned=false){let p=parse(c[3]);return `<article class="course ${used?'used':''}" ${planned?'':`draggable="${!used}" data-id="${c[0]}"`}><div class="row"><strong>${c[1]}</strong><span class="pill">${planned?fmt(credit(c)):p.label}학점</span></div><div class="meta"><span class="pill tag" data-cat="${c[2]}">${c[2]}</span>${p.hours?`<span class="pill">시수 ${fmt(p.hours)}</span>`:''}${p.ap!==null?`<span class="pill">AP ${fmt(p.ap)}</span>`:''}</div><div class="course-actions">${planned?`<button class="btn danger small" data-remove="${c[0]}" type="button">삭제</button>`:`<button class="btn small" data-add="${c[0]}" ${used?'disabled':''} type="button">${used?'추가됨':'담기'}</button>`}</div></article>`}
    function renderPlan(){REQ.forEach(c=>c[2]='필수');$('#required').innerHTML=REQ.map(c=>card(c,false,true).replace(/<div class="course-actions">.*?<\/div>/,'')).join('');$('#reqTotal').textContent=`${fmt(reqTotal())}학점`;$('#filters').innerHTML=CATS.map(c=>`<button class="btn filter ${planner.cat===c?'on':''}" data-filter="${c}" type="button">${c}</button>`).join('');let cand=courses().filter(c=>planner.cat==='전체'||c[2]===planner.cat);$('#candCount').textContent=`${cand.length}개`;$('#candidates').innerHTML=cand.map(c=>card(c,planner.ids.includes(c[0]))).join('');let sel=selected();$('#empty').classList.toggle('hide',sel.length>0);$('#planned').innerHTML=sel.map(c=>card(c,false,true)).join('');let planTotal=sel.reduce((a,c)=>a+credit(c),0);$('#planTotal').textContent=`${fmt(planTotal)}학점`;$('#gradTotal').textContent=`${fmt(planTotal)} / 38학점`;$('#progress').innerHTML=NEED.map(n=>{let v=sel.filter(c=>c[2]===n[0]).reduce((a,c)=>a+credit(c),0),miss=Math.max(0,n[1]-v),pct=Math.min(100,v/n[1]*100);return `<div class="need"><div class="row"><strong>${n[0]}</strong><strong>${fmt(v)} / ${fmt(n[1])}</strong></div><div class="meter"><b style="width:${pct}%"></b></div><div class="status ${miss?'miss':'done'}">${miss?`${fmt(miss)}학점 부족`:'충족'}</div></div>`}).join('');$('#semester').innerHTML=`<span>이번 학기 총 수강학점</span><strong>${fmt(reqTotal()+planTotal)}학점 = 필수 ${fmt(reqTotal())} + 계획 ${fmt(planTotal)}</strong><span>졸업 선택학점 ${fmt(Math.max(0,38-planTotal))}학점 남음</span>`;$$('[data-mode]').forEach(b=>b.classList.toggle('on',b.dataset.mode===planner.mode))}
    function add(id){if(id&&!planner.ids.includes(id)){planner.ids.push(id);save();renderPlan()}}function remove(id){planner.ids=planner.ids.filter(x=>x!==id);save();renderPlan()}
    document.addEventListener('change',e=>{let g=e.target.dataset.grade;if(g){e.target.value?grades[g]=e.target.value:delete grades[g];save();renderGpa()}});$('#bulk').addEventListener('change',e=>{if(!e.target.value)return;GPA.forEach(c=>grades[c[0]]=e.target.value);e.target.value='';save();renderGpa()});$('#resetGpa').onclick=()=>{grades={};save();renderGpa()};$$('[data-view]').forEach(b=>b.onclick=()=>{$$('[data-view]').forEach(x=>x.classList.toggle('on',x===b));$$('.view').forEach(v=>v.classList.toggle('on',v.id===b.dataset.view))});document.addEventListener('click',e=>{if(e.target.dataset.add)add(e.target.dataset.add);if(e.target.dataset.remove)remove(e.target.dataset.remove);if(e.target.dataset.filter){planner.cat=e.target.dataset.filter;save();renderPlan()}if(e.target.dataset.mode){planner.mode=e.target.dataset.mode;save();renderPlan()}});$('#resetPlan').onclick=()=>{planner.ids=[];save();renderPlan()};$('#drop').ondragover=e=>{e.preventDefault();$('#drop').classList.add('over')};$('#drop').ondragleave=()=>$('#drop').classList.remove('over');$('#drop').ondrop=e=>{e.preventDefault();$('#drop').classList.remove('over');add(e.dataTransfer.getData('text/plain'))};document.addEventListener('dragstart',e=>{let c=e.target.closest('[data-id]');if(c&&!c.classList.contains('used'))e.dataTransfer.setData('text/plain',c.dataset.id)});$('#custom').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),name=f.get('name').trim(),cr=f.get('credit').trim(),cat=f.get('cat');if(!name||!cr||parse(cr).base<=0)return;planner.custom.push([`u${Date.now()}`,name,cat,cr]);e.target.reset();save();renderPlan()};renderGpa();renderPlan();
  </script>
</body>
</html>
