<!doctype html>
<html lang='ko'>
<head>

<style>
:root{--bg:#f5f6f8;--paper:#fff;--ink:#202124;--muted:#626a73;--line:#d9dee5;--teal:#117865;--soft:#e6f2ef;--red:#b13a25;--blue:#21548f;--shadow:0 14px 34px #20212418}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Segoe UI,Apple SD Gothic Neo,Malgun Gothic,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}h1,h2,h3,p{margin:0}header{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;padding:24px clamp(12px,4vw,42px) 16px;background:var(--paper);border-bottom:1px solid var(--line)}.eyebrow{margin:0 0 6px;color:var(--teal);font-size:.82rem;font-weight:800}h1{font-size:clamp(1.4rem,2.4vw,2.1rem)}h2{font-size:clamp(1.18rem,2vw,1.55rem)}nav{display:flex;gap:4px;max-width:100%;overflow:auto;padding:4px;border-radius:8px;background:#e9edf1}.tab{min-height:38px;border:0;border-radius:6px;background:transparent;color:var(--muted);font-weight:800;padding:0 12px;white-space:nowrap}.tab.on{background:#fff;color:var(--ink);box-shadow:0 1px 5px #0002}main{width:min(1220px,calc(100% - 28px));margin:24px auto 48px}.view{display:none}.view.on{display:block}.head,.card,.panel{background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:18px;margin-bottom:14px}.head p{margin-top:6px;color:var(--muted)}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{min-height:36px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:800;padding:0 11px}.primary{border-color:var(--teal);background:var(--teal);color:#fff}.danger{border-color:#e5b6aa;background:#fff7f4;color:var(--red)}input,select,textarea{min-height:38px;border:1px solid var(--line);border-radius:6px;padding:0 9px;background:#fff}textarea{min-height:72px;padding:9px;resize:vertical}.stats,.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}.stat{padding:15px}.stat span{display:block;color:var(--muted);font-size:.85rem;font-weight:800}.stat strong{display:block;margin-top:8px;font-size:1.55rem}.table{overflow:auto}.table table{width:100%;min-width:830px;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{background:#f0f2f4;color:#3e434a;font-size:.86rem}.pill{display:inline-flex;align-items:center;min-height:26px;padding:0 8px;border-radius:999px;background:#e8ebef;font-size:.82rem;font-weight:800;white-space:nowrap}.quick{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.grade{min-width:44px;min-height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:900}.grade.on{background:var(--soft);border-color:var(--teal);color:#0b5f50}.layout{display:grid;grid-template-columns:.85fr 1.2fr 1fr;gap:14px;align-items:start}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.panel{padding:15px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.list{display:grid;gap:9px}.course,.event{display:grid;gap:8px;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}.course[draggable=true]{cursor:grab}.used{opacity:.55}.row{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.meta{display:flex;gap:6px;flex-wrap:wrap}.drop{min-height:330px;border:2px dashed #b7c2cc;border-radius:8px;background:#fafbfc;padding:10px}.drop.over{border-color:var(--teal);background:var(--soft)}.empty{display:grid;min-height:90px;place-items:center;color:var(--muted);font-weight:800}.empty.hide{display:none}.custom,.event-form{display:grid;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.custom{grid-template-columns:1fr .7fr .7fr auto}.meter{height:10px;border-radius:999px;background:#e5e8ec;overflow:hidden}.meter b{display:block;height:100%;background:var(--teal)}.semester{display:flex;justify-content:space-between;gap:10px;margin-top:12px;padding:13px;border-radius:8px;background:#f0f2f4;font-weight:800}.calc-wrap{display:grid;grid-template-columns:1fr .75fr;gap:14px}.display{padding:15px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd}.expr{min-height:54px;word-break:break-word;font-weight:900;font-size:1.22rem}.res{text-align:right;color:#0b5f50;font-size:1.7rem;font-weight:900;min-height:40px}.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.key{min-height:44px;border:1px solid var(--line);border-radius:6px;background:#fff;font-weight:900}.op{background:#eef4f3;color:#0b5f50}.eq{background:var(--teal);color:#fff;border-color:var(--teal)}.warn{background:#fff7f4;color:var(--red)}.frac{display:none;grid-template-columns:1fr auto;gap:10px;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px}.frac.on{display:grid}.fracStack{display:grid;grid-template-rows:auto 1px auto}.fracStack input{text-align:center}.bar{background:#333}.tip{color:var(--muted);line-height:1.55}.clock{display:grid;place-items:center;min-height:126px;margin-bottom:10px;border:1px solid var(--line);border-radius:8px;background:#fbfcfd;font-size:clamp(2rem,7vw,3.8rem);font-weight:900}.clock.done{background:#fff2e8;color:#9c3d1f}.time-inputs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.time-inputs label{display:grid;gap:5px;color:var(--muted);font-size:.84rem;font-weight:800}.quick-times{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}.laps{max-height:220px;overflow:auto}.lap{display:flex;justify-content:space-between;padding:8px;border-bottom:1px solid var(--line)}.cal-layout{display:grid;grid-template-columns:1fr .85fr;gap:14px}.cal-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:.82rem;font-weight:900}.day{min-height:96px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:7px;text-align:left}.day.muted{opacity:.45}.day.today{border-color:var(--teal);box-shadow:inset 0 0 0 2px var(--soft)}.day.selected{background:#eef7f4;border-color:var(--teal)}.chip{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:4px;padding:2px 5px;border-radius:5px;background:#e8ebef;font-size:.75rem}.chip.imp,.event.imp{background:#fffaf0;border-color:#e5c16a}.line{display:grid;grid-template-columns:110px 1fr;gap:8px}.search-results{display:grid;gap:8px;margin-top:10px}@media(max-width:900px){header,.head{align-items:stretch;flex-direction:column}.layout,.two,.calc-wrap,.cal-layout,.stats,.grid{grid-template-columns:1fr}.custom{grid-template-columns:1fr 1fr}.quick-times{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){main{width:calc(100% - 18px)}header{padding:18px 10px 12px}.keys{grid-template-columns:repeat(4,1fr)}.custom,.line{grid-template-columns:1fr}.day{min-height:78px;padding:5px}.quick-times{grid-template-columns:repeat(2,1fr)}.semester{flex-direction:column}}
</style>
</head>
<body><header><div><p class='eyebrow'>HanQ 학업 도구</p><h1>학점 계산기 · 수강 미리보기 · 학습 도구</h1></div><nav id='tabs'><button class='tab on' data-v='gpa'>학점 계산기</button><button class='tab' data-v='plan'>수강 미리보기</button><button class='tab' data-v='calc'>공학용 계산기</button><button class='tab' data-v='time'>타이머</button><button class='tab' data-v='cal'>캘린더</button></nav></header><main><section id='gpa' class='view on'></section><section id='plan' class='view'></section><section id='calc' class='view'></section><section id='time' class='view'></section><section id='cal' class='view'></section></main>
<script>
const $=q=>document.querySelector(q),$$=q=>[...document.querySelectorAll(q)],load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch{return d}},save=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const subs=[['math3','수학Ⅲ',4],['physics','기초물리학및실험Ⅲ',2],['chem','기초화학및실험Ⅲ',2],['bio','기초생명과학및실험Ⅲ',2],['earth','기초지구과학및실험Ⅲ',2],['programming','컴퓨터프로그래밍',3],['literature','문학감상과비평',3],['english','영어회화',3],['economy','글로벌경제의이해',2],['japanese','일본어',2]],scale=[['A+',4.3],['A0',4],['A-',3.7],['B+',3.3],['B0',3],['B-',2.7],['C+',2.3],['C0',2],['C-',1.7],['D+',1.3],['D0',1],['D-',.7],['F',0]],quick=['A+','A0','A-','B+','B0'];
let grades=load('hanqGrades',{}),planner=load('hanqPlanner',{ids:[],custom:[],cat:'all',mode:'base'});if(['전체','영어','외국어','교양','전문교과'].includes(planner.cat))planner.cat='all';
const names={literature:'문학감상과비평',math3:'수학Ⅲ',chem:'기초화학및실험Ⅲ',physics:'기초물리학및실험Ⅲ',bio:'기초생명과학및실험Ⅲ',earth:'기초지구과학및실험Ⅲ',english:'영어회화',japanese:'일본어',economy:'글로벌경제의이해',programming:'컴퓨터프로그래밍',ip:'지식재산일반',startup:'기업가정신및기술창업교육',sdg:'지속가능발전의이해'};
const req=[['r1',names.literature,'req','3'],['r2',names.math3,'req','4'],['r3',names.chem,'req','2'],['r4',names.physics,'req','2'],['r5',names.bio,'req','2'],['r6',names.earth,'req','2']],base=[['c1',names.english,'eng','3'],['c2',names.japanese,'lang','2'],['c3',names.economy,'liberal','2'],['c4',names.ip,'liberal','2'],['c5',names.startup,'liberal','2'],['c6',names.sdg,'liberal','2'],['c7',names.programming,'major','3']],cats=[['all','전체'],['eng','영어'],['lang','외국어'],['liberal','교양'],['major','전문교과']],need=[['eng','영어',3],['lang','외국어',2],['liberal','교양',4],['major','전문교과',29]];
const fmt=n=>Number.isInteger(Math.round(n*10)/10)?String(Math.round(n*10)/10):(Math.round(n*10)/10).toFixed(1),pt=g=>(scale.find(x=>x[0]===g)||[])[1],parseCr=t=>{t=String(t||'');if(t.includes('/')){let p=t.split('/');return{base:+p[0]||0,ap:+p[1]||0,label:fmt(+p[0]||0)+'/'+fmt(+p[1]||0)+' [AP]',hours:0}}if(t.includes('(')){let a=t.split('('),b=a[1].split(')')[0];return{base:+b||0,ap:null,label:fmt(+a[0]||0)+'('+fmt(+b||0)+')',hours:+a[0]||0}}return{base:+t||0,ap:null,label:fmt(+t||0),hours:0}},cr=c=>{let p=parseCr(c[3]);return planner.mode==='ap'&&p.ap!=null?p.ap:p.base};
function renderGpa(){let entered=0,sum=0,total=subs.reduce((a,s)=>a+s[2],0);$('#gpa').innerHTML=`<div class='head'><div><h2>4.3 만점 학점 계산기</h2><p>총 반영 학점 25학점</p></div><div class='actions'><label>전체 입력 <select id='bulk'><option value=''>선택</option>${scale.map(x=>`<option>${x[0]}</option>`).join('')}</select></label><button class='btn' id='resetGpa'>초기화</button></div></div><div class='stats' id='stats'></div><div class='card table'><table><thead><tr><th>과목</th><th>학점</th><th>성적</th><th>환산점수</th><th>반영점수</th></tr></thead><tbody>${subs.map(s=>{let g=grades[s[0]]||'',p=pt(g);if(g){entered+=s[2];sum+=p*s[2]}let lows=scale.filter(x=>!quick.includes(x[0])).map(x=>`<option value='${x[0]}' ${g===x[0]?'selected':''}>${x[0]} (${x[1].toFixed(1)})</option>`).join('');return `<tr><td><strong>${s[1]}</strong></td><td><span class='pill'>${s[2]}학점</span></td><td><div class='quick'>${quick.map(q=>`<button class='grade ${g===q?'on':''}' data-grade-id='${s[0]}' data-grade='${q}'>${q}</button>`).join('')}<select data-low='${s[0]}'><option value=''>B- 이하</option>${lows}</select></div></td><td>${p??'-'}</td><td>${p==null?'-':(p*s[2]).toFixed(2)}</td></tr>`}).join('')}</tbody></table></div>`;$('#stats').innerHTML=[['평점',entered?(sum/entered).toFixed(2):'-','4.3 만점'],['입력 학점',entered,`전체 ${total}학점`],['반영점수',sum.toFixed(2),'성적점수 × 학점'],['남은 입력',total-entered,total-entered?'학점':'완료']].map(x=>`<div class='card stat'><span>${x[0]}</span><strong>${x[1]}</strong><em>${x[2]}</em></div>`).join('')}
function saveStudy(){save('hanqGrades',grades);save('hanqPlanner',planner)}function courses(){return base.concat(planner.custom)}function selected(){return planner.ids.map(id=>courses().find(c=>c[0]===id)).filter(Boolean)}function card(c,used,planned){let p=parseCr(c[3]),lab=c[2]==='req'?'필수수강':(cats.find(x=>x[0]===c[2])||[])[1];return `<article class='course ${used?'used':''}' ${planned?'':`draggable='${!used}' data-id='${c[0]}'`}><div class='row'><strong>${c[1]}</strong><span class='pill'>${planned?fmt(cr(c)):p.label}학점</span></div><div class='meta'><span class='pill'>${lab||c[2]}</span>${p.hours?`<span class='pill'>시수 ${fmt(p.hours)}</span>`:''}${p.ap?`<span class='pill'>AP ${fmt(p.ap)}</span>`:''}</div><div class='actions'>${planned?`<button class='btn danger' data-rm='${c[0]}'>삭제</button>`:`<button class='btn' data-add='${c[0]}' ${used?'disabled':''}>${used?'추가됨':'담기'}</button>`}</div></article>`}
function renderPlan(){let sel=selected(),rt=req.reduce((a,c)=>a+cr(c),0),ptot=sel.reduce((a,c)=>a+cr(c),0);$('#plan').innerHTML=`<div class='head'><div><h2>수강 신청 미리보기</h2><p>선택과목 후보가 아니라 수강계획에 넣은 과목만 계산</p></div><div class='actions'><button class='btn ${planner.mode==='base'?'primary':''}' data-mode='base'>기본</button><button class='btn ${planner.mode==='ap'?'primary':''}' data-mode='ap'>AP</button><button class='btn' id='resetPlan'>계획 비우기</button></div></div><div class='layout'><aside class='panel'><div class='title'><h3>필수수강</h3><strong>${fmt(rt)}학점</strong></div><div class='list'>${req.map(c=>card(c,0,1).replace(/<div class='actions'>.*<\/div>/,'' )).join('')}</div></aside><section class='panel'><div class='title'><h3>선택과목 후보</h3><strong>${courses().length}</strong></div><div class='actions'>${cats.map(c=>`<button class='btn ${planner.cat===c[0]?'primary':''}' data-filter='${c[0]}'>${c[1]}</button>`).join('')}</div><div class='list'>${courses().filter(c=>planner.cat==='all'||c[2]===planner.cat).map(c=>card(c,planner.ids.includes(c[0]),0)).join('')}</div><form class='custom' id='custom'><input name='name' placeholder='과목명' required><input name='credit' placeholder='3, 4(3), 3/4 [AP]' required><select name='cat'><option value='eng'>영어</option><option value='lang'>외국어</option><option value='liberal'>교양</option><option value='major'>전문교과</option></select><button class='btn primary'>추가</button></form></section><section class='panel'><div class='title'><h3>수강계획</h3><strong>${fmt(ptot)}학점</strong></div><div class='drop' id='drop'><div class='empty ${sel.length?'hide':''}'>여기에 과목 놓기</div><div class='list'>${sel.map(c=>card(c,0,1)).join('')}</div></div></section></div><section class='panel' style='margin-top:14px'><div class='title'><h3>졸업 선택학점</h3><strong>${fmt(ptot)} / 38학점</strong></div><div class='grid'>${need.map(n=>{let v=sel.filter(c=>c[2]===n[0]).reduce((a,c)=>a+cr(c),0),m=Math.max(0,n[2]-v);return `<div class='card stat'><span>${n[1]}</span><strong>${fmt(v)} / ${n[2]}</strong><div class='meter'><b style='width:${Math.min(100,v/n[2]*100)}%'></b></div><em>${m?fmt(m)+'학점 부족':'충족'}</em></div>`}).join('')}</div><div class='semester'><span>이번 학기 총 수강학점</span><strong>${fmt(rt+ptot)}학점 = 필수 ${fmt(rt)} + 계획 ${fmt(ptot)}</strong><span>졸업 선택 ${fmt(Math.max(0,38-ptot))}학점 남음</span></div></section>`}
let cs=load('scientificCalculatorState',{expr:'',result:'',mode:'DEG'});function vis(s){return String(s||'').split('sqrt(').join('√(').split('pi').join('π').split('asin(').join('sin⁻¹(').split('acos(').join('cos⁻¹(').split('atan(').join('tan⁻¹(')}function renderCalc(){let keys=[['sin(','sin'],['cos(','cos'],['tan(','tan'],['asin(','sin⁻¹'],['acos(','cos⁻¹'],['atan(','tan⁻¹'],['sqrt(','√'],['^2','x²'],['^','xʸ'],['log(','log'],['ln(','ln'],['pi','π'],['e','e'],['(', '('],[')',')'],['7','7'],['8','8'],['9','9'],['÷','÷'],['DEL','DEL'],['4','4'],['5','5'],['6','6'],['×','×'],['AC','AC'],['1','1'],['2','2'],['3','3'],['-','-'],['=','='],['0','0'],['.','.'],['+','+'],['a/b','a/b']];$('#calc').innerHTML=`<div class='head'><div><h2>공학용 계산기</h2><p>삼각함수, 로그, 루트, 거듭제곱, π, e, 분수 입력</p></div><div class='actions'><button class='btn primary' id='angle'>${cs.mode}</button></div></div><div class='calc-wrap'><section class='panel'><div class='display'><div class='expr'>${vis(cs.expr)||'0'}</div><div class='res'>${cs.result||''}</div></div><div class='frac' id='frac'><div class='fracStack'><input id='fn' placeholder='분자'><span class='bar'></span><input id='fd' placeholder='분모'></div><button class='btn primary' id='insFrac'>분수 넣기</button></div><div class='keys'>${keys.map(k=>`<button class='key ${k[0]==='='?'eq':k[0]==='AC'||k[0]==='DEL'?'warn':k[0].length>1||'+-×÷^'.includes(k[0])?'op':''}' data-calc='${k[0]}'>${k[1]}</button>`).join('')}</div></section><aside class='panel'><div class='title'><h3>각도 모드</h3><strong>${cs.mode}</strong></div><p class='tip'>DEG에서는 sin(30)=0.5, RAD에서는 sin(π/2)=1로 계산한다. 잘못된 수식은 결과창에 오류 메시지로 표시한다.</p></aside></div>`}
function calcSave(){save('scientificCalculatorState',cs)}function calcRun(){try{let s=cs.expr.split('×').join('*').split('÷').join('/'),i=0;function skip(){while(s[i]===' ')i++}function name(){let st=i;while(i<s.length&&((s[i]>='a'&&s[i]<='z')||s[i]==='π'))i++;return s.slice(st,i)}function num(){let st=i;while(i<s.length&&((s[i]>='0'&&s[i]<='9')||s[i]==='.'))i++;return +s.slice(st,i)}function prim(){skip();let c=s[i];if(c==='('){i++;let v=expr();skip();if(s[i]!==')')throw 1;i++;return v}if(c==='+'||c==='-'){i++;let v=prim();return c==='-'?-v:v}if((c>='0'&&c<='9')||c==='.')return num();let n=name();if(n==='pi'||n==='π')return Math.PI;if(n==='e')return Math.E;if(n){skip();if(s[i]!=='(')throw 1;i++;let v=expr();skip();if(s[i]!==')')throw 1;i++;let d=cs.mode==='DEG',r=Math.PI/180;if(n==='sin')return Math.sin(d?v*r:v);if(n==='cos')return Math.cos(d?v*r:v);if(n==='tan')return Math.tan(d?v*r:v);if(n==='asin')return d?Math.asin(v)/r:Math.asin(v);if(n==='acos')return d?Math.acos(v)/r:Math.acos(v);if(n==='atan')return d?Math.atan(v)/r:Math.atan(v);if(n==='sqrt')return Math.sqrt(v);if(n==='log')return Math.log10(v);if(n==='ln')return Math.log(v)}throw 1}function pow(){let v=prim();skip();if(s[i]==='^'){i++;v=Math.pow(v,pow())}return v}function term(){let v=pow();for(;;){skip();let c=s[i];if(c==='*'||c==='/'){i++;let b=pow();v=c==='*'?v*b:v/b}else return v}}function expr(){let v=term();for(;;){skip();let c=s[i];if(c==='+'||c==='-'){i++;let b=term();v=c==='+'?v+b:v-b}else return v}}let v=expr();skip();if(i<s.length||!isFinite(v))throw 1;cs.result=String(Math.abs(v-Math.round(v))<1e-10?Math.round(v):+v.toPrecision(12))}catch{cs.result='수식 오류를 확인하세요'}calcSave();renderCalc()}
const pad=n=>String(Math.max(0,Math.floor(n))).padStart(2,'0'),fmtT=ms=>{ms=Math.max(0,ms);return `${pad(ms/36e5)}:${pad(ms%36e5/6e4)}:${pad(ms%6e4/1e3)}`},fmtS=ms=>fmtT(ms)+'.'+pad(ms%1000/10);let ts=load('timerStopwatchState',{timer:{dur:0,rem:0,run:false,end:0,msg:''},stop:{el:0,run:false,start:0,laps:[]},inp:{h:0,m:25,s:0}});
function getTimer(){let t=ts.timer;if(t.run){let r=Math.max(0,t.end-Date.now());if(!r){t.run=false;t.rem=0;t.msg='타이머 종료';beep()}return r}return t.rem||t.dur||0}function getStop(){let s=ts.stop;return s.run?s.el+Date.now()-s.start:s.el}function timeSave(){save('timerStopwatchState',ts)}function beep(){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},180)}catch{}}function renderTime(){let t=getTimer(),sw=getStop();$('#time').innerHTML=`<div class='head'><div><h2>타이머 · 스톱워치</h2><p>실제 경과 시간 기준으로 동작하고 기록을 저장</p></div></div><div class='two'><section class='panel'><div class='title'><h3>타이머</h3><strong>${ts.timer.run?'실행 중':'대기'}</strong></div><div class='clock ${ts.timer.msg?'done':''}' id='td'>${ts.timer.msg||fmtT(t)}</div><div class='time-inputs'><label>시간<input id='h' type='number' min='0' value='${ts.inp.h}'></label><label>분<input id='m' type='number' min='0' value='${ts.inp.m}'></label><label>초<input id='s' type='number' min='0' value='${ts.inp.s}'></label></div><div class='quick-times'>${[1,3,5,10,25,50].map(m=>`<button class='btn' data-qt='${m}'>${m}분</button>`).join('')}</div><div class='actions'><button class='btn primary' id='tStart'>시작</button><button class='btn' id='tPause'>일시정지</button><button class='btn' id='tResume'>재개</button><button class='btn danger' id='tReset'>초기화</button></div></section><section class='panel'><div class='title'><h3>스톱워치</h3><strong>${ts.stop.run?'실행 중':'대기'}</strong></div><div class='clock' id='sd'>${fmtS(sw)}</div><div class='actions'><button class='btn primary' id='sStart'>시작</button><button class='btn' id='sPause'>일시정지</button><button class='btn' id='sResume'>재개</button><button class='btn' id='lap'>랩 기록</button><button class='btn danger' id='sReset'>초기화</button><button class='btn danger' id='lapClear'>랩 삭제</button></div><div class='laps'>${ts.stop.laps.map((l,i)=>`<div class='lap'><strong>#${ts.stop.l setInterval(()=>{if($('#time').classList.contains('on')){let a=$('#td'),b=$('#sd');if(a)a.textContent=ts.timer.msg||fmtT(getTimer());if(b)b.textContent=fmtS(getStop());timeSave()}},250);
const dk=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,today=dk(new Date());let cal=load('calendarState',{y:new Date().getFullYear(),m:new Date().getMonth(),sel:today,events:{}});function sortE(a,b){if(a.time&&b.time)return a.time.localeCompare(b.time);if(a.time)return -1;if(b.time)return 1;return a.title.localeCompare(b.title)}function dayList(k){let e=(cal.events[k]||[]).sort(sortE);return e.length?e.map(x=>`<article class='event ${x.imp?'imp':''}'><div class='row'><strong>${x.imp?'★ ':''}${x.title}</strong><span class='pill'>${x.time||'시간 없음'}</span></div><div class='meta'><span class='pill'>${x.cat}</span>${x.note?`<span>${x.note}</span>`:''}</div><div class='actions'><button class='btn' data-edit='${k}|${x.id}'>수정</button><button class='btn danger' data-del='${k}|${x.id}'>삭제</button></div></article>`).join(''):`<div class='empty'>선택한 날짜에 일정 없음</div>`}function renderCal(){let first=new Date(cal.y,cal.m,1).getDay(),days=new Date(cal.y,cal.m+1,0).getDate(),prev=new Date(cal.y,cal.m,0).getDate(),cells=[];for(let i=first-1;i>=0;i--)cells.push(new Date(cal.y,cal.m-1,prev-i));for(let d=1;d<=days;d++)cells.push(new Date(cal.y,cal.m,d));while(cells.length%7)cells.push(new Date(cal.y,cal.m+1,cells.length-days-first+1));$('#cal').innerHTML=`<div class='head'><div><h2>캘린더</h2><p>일정 추가, 수정, 삭제, 검색 지원</p></div><div class='actions'><input id='search' placeholder='일정 검색'><button class='btn' id='today'>오늘</button></div></div><div class='cal-layout'><section class='panel'><div class='cal-top'><button class='btn' id='prev'>이전 달</button><h2>${cal.y}년 ${cal.m+1}월</h2><button class='btn' id='next'>다음 달</button></div><div class='cal-grid'>${['일','월','화','수','목','금','토'].map(d=>`<div class='dow'>${d}</div>`).join('')}${cells.map(d=>{let k=dk(d),e=(cal.events[k]||[]).sort(sortE);return `<button class='day ${d.getMonth()!==cal.m?'muted':''} ${k===today?'today':''} ${k===cal.sel?'selected':''}' data-date='${k}'><strong>${d.getDate()}</strong>${e.slice(0,3).map(x=>`<span class='chip ${x.imp?'imp':''}'>${x.time?x.time+' ':''}${x.title}</span>`).join('')}${e.length>3?`<span class='chip'>+${e.length-3}</span>`:''}</button>`}).join('')}</div></section><aside class='panel'><div class='title'><h3>${cal.sel}</h3><strong>${(cal.events[cal.sel]||[]).length}개</strong></div><form class='event-form' id='eventForm'><input type='hidden' name='id'><input name='title' placeholder='일정 제목' required><div class='line'><input name='time' type='time'><select name='cat'><option>공부</option><option>수행평가</option><option>시험</option><option>R&E</option><option>기타</option></select></div><textarea name='note' placeholder='메모'></textarea><label class='quick'><input name='imp' type='checkbox'> 중요 일정</label><div class='actions'><button class='btn primary'>저장</button><button class='btn' id='cancel' type='button'>취소</button></div></form><div class='list'>${dayList(cal.sel)}</div><div class='search-results' id='sr'></div></aside></div>`}function calSave(){save('calendarState',cal)}function clearForm(){let f=$('#eventForm');if(f){f.reset();f.id.value=''}}function fillEvent(e){let f=$('#eventForm');f.id.value=e.id;f.title.value=e.title;f.time.value=e.time||'';f.cat.value=e.cat||'공부';f.note.value=e.note||'';f.imp.checked=!!e.imp}function search(q){q=q.trim().toLowerCase();if(!q){$('#sr').innerHTML='';return}let r=[];Object.entries(cal.events).forEach(([d,arr])=>arr.forEach(e=>{if((e.title+' '+(e.note||'')).toLowerCase().includes(q))r.push([d,e])}));$('#sr').innerHTML=r.length?r.map(x=>`<button class='btn' data-go='${x[0]}'>${x[0]} ${x[1].time||''} ${x[1].title} · ${x[1].cat}</button>`).join(''):`<div class='empty'>검색 결과 없음</div>`}
function show(v){$$('.tab').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$$('.view').forEach(s=>s.classList.toggle('on',s.id===v));if(v==='gpa')renderGpa();if(v==='plan')renderPlan();if(v==='calc')renderCalc();if(v==='time')renderTime();if(v==='cal')renderCal()}
document.addEventListener('click',e=>{let t=e.target;if(t.dataset.v)show(t.dataset.v);if(t.dataset.gradeId){grades[t.dataset.gradeId]=t.dataset.grade;saveStudy();renderGpa()}if(t.id==='resetGpa'){grades={};saveStudy();renderGpa()}if(t.dataset.add){if(!planner.ids.includes(t.dataset.add))planner.ids.push(t.dataset.add);saveStudy();renderPlan()}if(t.dataset.rm){planner.ids=planner.ids.filter(x=>x!==t.dataset.rm);saveStudy();renderPlan()}if(t.dataset.filter){planner.cat=t.dataset.filter;saveStudy();renderPlan()}if(t.dataset.mode){planner.mode=t.dataset.mode;saveStudy();renderPlan()}if(t.id==='resetPlan'){planner.ids=[];saveStudy();renderPlan()}if(t.dataset.calc){let v=t.dataset.calc;if(v==='AC'){cs.expr='';cs.result=''}else if(v==='DEL'){cs.expr=cs.expr.slice(0,-1);cs.result=''}else if(v==='=')return calcRun();else if(v==='a/b'){$('#frac').classList.toggle('on');return}else cs.expr+=v;calcSave();renderCalc()}if(t.id==='angle'){cs.mode=cs.mode==='DEG'?'RAD':'DEG';calcSave();renderCalc()}if(t.id==='insFrac'){let a=$('#fn').value.trim(),b=$('#fd').value.trim();if(a&&b){cs.expr+=`(${a})/(${b})`;calcSave();renderCalc()}}if(t.dataset.qt){ts.inp={h:0,m:+t.dataset.qt,s:0};ts.timer={dur:+t.dataset.qt*60000,rem:+t.dataset.qt*60000,run:false,end:0,msg:''};timeSave();renderTime()}if(t.id==='tStart'){let h=+$('#h').value||0,m=+$('#m').value||0,s=+$('#s').value||0,ms=(h*3600+m*60+s)*1000;ts.inp={h,m,s};ts.timer=ms>0?{dur:ms,rem:ms,run:true,end:Date.now()+ms,msg:''}:{dur:0,rem:0,run:false,end:0,msg:'시간을 입력하세요'};timeSave();renderTime()}if(t.id==='tPause'){ts.timer.rem=getTimer();ts.timer.run=false;timeSave();renderTime()}if(t.id==='tResume'){let r=ts.timer.rem||ts.timer.dur;if(r>0){ts.timer.run=true;ts.timer.end=Date.now()+r;ts.timer.msg=''}timeSave();renderTime()}if(t.id==='tReset'){ts.timer={dur:0,rem:0,run:false,end:0,msg:''};timeSave();renderTime()}if(t.id==='sStart'||t.id==='sResume'){if(!ts.stop.run){ts.stop.run=true;ts.stop.start=Date.now()}timeSave();renderTime()}if(t.id==='sP document.addEventListener('change',e=>{let t=e.target;if(t.dataset.low){t.value?grades[t.dataset.low]=t.value:delete grades[t.dataset.low];saveStudy();renderGpa()}if(t.id==='bulk'){if(t.value){subs.forEach(s=>grades[s[0]]=t.value);saveStudy();renderGpa()}}});document.addEventListener('input',e=>{if(['h','m','s'].includes(e.target.id)){ts.inp={h:+$('#h').value||0,m:+$('#m').value||0,s:+$('#s').value||0};timeSave()}if(e.target.id==='search')search(e.target.value)});document.addEventListener('dragstart',e=>{let c=e.target.closest('[data-id]');if(c&&!c.classList.contains('used'))e.dataTransfer.setData('text/plain',c.dataset.id)});document.addEventListener('dragover',e=>{if(e.target.closest('#drop')){e.preventDefault();$('#drop').classList.add('over')}});document.addEventListener('dragleave',e=>{if(e.target.closest('#drop'))$('#drop').classList.remove('over')});document.addEventListener('drop',e=>{if(e.target.closest('#drop')){e.preventDefault();$('#drop').classList.remove('over');let id=e.dataTransfer.getData('text/plain');if(id&&!planner.ids.includes(id)){planner.ids.push(id);saveStudy();renderPlan()}}});document.addEventListener('submit',e=>{if(e.target.id==='custom'){e.preventDefault();let f=new FormData(e.target),n=f.get('name').trim(),c=f.get('credit').trim();if(n&&parseCr(c).base>0){planner.custom.push(['u'+Date.now(),n,f.get('cat'),c]);e.target.reset();saveStudy();renderPlan()}}if(e.target.id==='eventForm'){e.preventDefault();let f=new FormData(e.target),title=f.get('title').trim();if(!title){alert('일정 제목을 입력하세요');return}let time=f.get('time'),id=f.get('id')||'e'+Date.now(),item={id,title,time,cat:f.get('cat'),note:f.get('note').trim(),imp:!!f.get('imp')};cal.events[cal.sel]=cal.events[cal.sel]||[];let i=cal.events[cal.sel].findIndex(x=>x.id===id);i>=0?cal.events[cal.sel][i]=item:cal.events[cal.sel].push(item);calSave();renderCal()}});renderGpa();renderPlan();renderCalc();renderTime();renderCal();
